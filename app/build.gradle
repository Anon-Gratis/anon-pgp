plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'gratis.anon.pgp'
    compileSdk 35

    defaultConfig {
        applicationId "gratis.anon.pgp"
        minSdk 23
        targetSdk 35
        versionCode 11
        versionName "0.3.7"
        resValue "string", "app_name", "Anon PGP"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    splits {
        abi {
            enable false  // no native libs — single APK
        }
    }

    // Declare release buildType first, then layer signing on top if config exists.
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    if (file("signing.properties").exists()) {
        Properties props = new Properties()
        props.load(new FileInputStream(file("signing.properties")))
        signingConfigs {
            release {
                storeFile file(props['keystore'])
                storePassword props['keystore.password']
                keyAlias props['keystore.alias']
                keyPassword props['keystore.password']
            }
        }
        buildTypes.release.signingConfig = signingConfigs.release
    }

    // Bouncy Castle bcpg + bcprov + bcutil ship duplicate META-INF files at
    // these paths; packaging fails without excludes.
    packaging {
        resources {
            excludes += [
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                'META-INF/BC1024KE.DSA', 'META-INF/BC1024KE.SF',
                'META-INF/BC2048KE.DSA', 'META-INF/BC2048KE.SF',
                'META-INF/BCKEY.DSA',    'META-INF/BCKEY.SF'
            ]
        }
    }
}

dependencies {
    // Pure-JVM OpenPGP code lives in :core. Bouncy Castle (bcpg + bcprov)
    // arrives transitively through :core's `api` declarations.
    implementation project(':core')

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Coroutines for off-main-thread key generation + encrypt/decrypt
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Tabbed UI
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // QR codes (encode for display + camera scan via embedded ZXing fork)
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // App lock: encrypted PIN hash + biometric prompt + foreground/background tracking
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'
    implementation 'androidx.lifecycle:lifecycle-process:2.8.4'
}
