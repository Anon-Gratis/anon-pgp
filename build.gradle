// All plugins are declared here with `apply false` so subprojects can apply
// them by id without re-declaring versions. Compose Desktop ships the
// `org.jetbrains.kotlin.plugin.compose` and `org.jetbrains.compose` plugins;
// the Kotlin plugin version must match Kotlin itself.
plugins {
    id 'com.android.application'                  version '8.7.3'  apply false
    id 'org.jetbrains.kotlin.android'             version '2.0.21' apply false
    id 'org.jetbrains.kotlin.jvm'                 version '2.0.21' apply false
    id 'org.jetbrains.kotlin.plugin.compose'      version '2.0.21' apply false
    id 'org.jetbrains.compose'                    version '1.7.3'  apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // For Compose Multiplatform artifacts not on Maven Central.
        maven { url 'https://maven.pkg.jetbrains.space/public/p/compose/dev' }
    }
}
